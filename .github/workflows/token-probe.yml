# TEMPORARY — narrowing why release-windows gets 403 on POST /releases while
# every other run of the same call gets 201. Ruled out so far: repo permission
# default, re-run vs fresh run, workflow_dispatch vs tag push, branch vs tag
# ref. Remaining variables: the runner OS, and octokit (what tauri-action uses)
# vs the gh CLI.
name: token-probe

on:
  workflow_dispatch:
  push:
    tags: ["zz-probe-*"]

permissions:
  contents: write

jobs:
  windows-gh:
    runs-on: windows-latest
    steps:
      - name: gh CLI, on the same runner release-windows uses
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF os=windows"
          gh api -X POST "repos/$REPO/releases" \
            -f tag_name=zz-probe-win -F draft=true -i 2>&1 | head -2 || true
          id=$(gh api "repos/$REPO/releases" --jq '.[] | select(.tag_name=="zz-probe-win") | .id' || true)
          [ -n "$id" ] && gh api -X DELETE "repos/$REPO/releases/$id" && echo "win-gh: CREATED then cleaned" || echo "win-gh: NOT created"

  ubuntu-octokit:
    runs-on: ubuntu-latest
    steps:
      # github-script uses the same @octokit/rest that tauri-action does, with
      # the same token plumbing — this is the closest stand-in for the failing
      # call that does not involve building anything.
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              const r = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: 'zz-probe-octokit',
                draft: true,
              });
              core.info(`octokit: CREATED id=${r.data.id}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: r.data.id,
              });
              core.info('octokit: cleaned up');
            } catch (e) {
              core.info(`octokit: FAILED status=${e.status} message=${e.message}`);
            }
