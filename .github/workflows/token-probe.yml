# TEMPORARY diagnostic — delete once the v0.28.0 release question is settled.
#
# The release workflow builds fine and then fails on POST /releases with
# "Resource not accessible by integration", while the job's own "Set up job"
# log reports `Contents: write`. That message carries no response body, so this
# makes the same call from the same kind of token and prints what GitHub
# actually says.
name: token-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: what can this token do
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "--- repo visible to the token ---"
          gh api "repos/$REPO" --jq '{archived,disabled,visibility,fork}' || true

          echo "--- can it READ releases ---"
          gh api "repos/$REPO/releases?per_page=1" --jq '.[0].tag_name' || true

          echo "--- can it CREATE a PUBLISHED release, as tauri-action does ---"
          # draft=false is the difference from the first probe, and the only
          # variable left between this call and the one that 403s.
          set +e
          gh api -X POST "repos/$REPO/releases" \
            -f tag_name=zz-token-probe -f name=probe -F draft=false -F prerelease=false -i
          code=$?
          set -e
          echo "exit=$code"

          echo "--- clean up: the release AND the tag it published ---"
          id=$(gh api "repos/$REPO/releases" --jq '.[] | select(.tag_name=="zz-token-probe") | .id' || true)
          if [ -n "$id" ]; then
            gh api -X DELETE "repos/$REPO/releases/$id" && echo "deleted release $id"
          else
            echo "no release to clean up"
          fi
          # A published release creates the tag; leaving it behind would put a
          # junk tag in the repo and, worse, one matching the release
          # workflow's `v*` trigger is a hair away from being created here.
          gh api -X DELETE "repos/$REPO/git/refs/tags/zz-token-probe" \
            && echo "deleted tag" || echo "no tag to delete"
