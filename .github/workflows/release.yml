# Builds the installers on every version tag and publishes them (plus the
# updater artifacts + latest.json feed) to a GitHub Release. The in-app updater
# points at .../releases/latest/download/latest.json.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           minisign key for updater artifacts
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if none)
#
# Windows: Authenticode (SmartScreen) signing is a documented opt-in — when the
# Azure Trusted Signing account exists, follow docs/DISTRIBUTION.md
# §"Wiring the signature into CI". Until then installers are unsigned and
# testers see the SmartScreen prompt.
#
# macOS: the job below is SELF-ENABLING. It stays skipped until the six APPLE_*
# secrets exist, and starts building, signing and notarizing the moment they
# do — no edit to this file. Shipping an unsigned .app would be worse than
# shipping nothing: Gatekeeper refuses to open it at all, where Windows only
# warns. See docs/DISTRIBUTION.md §"Signing the macOS build".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Everything that can be known BEFORE spending ~20 minutes compiling Rust.
  #
  # v0.28.0 built for 19 minutes and then died on `POST /releases` with
  # "Resource not accessible by integration", three times. Every check below
  # takes seconds and every one of them fails the run before a single crate is
  # compiled — the point is not that these problems are likely, it is that
  # discovering them at the END costs 20 minutes and a re-tag each time.
  #
  # Secrets also cannot be read in a job-level `if:`, so the macOS presence
  # check has to happen inside a job and come back out as an output.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.check.outputs.macos }}
    steps:
      - uses: actions/checkout@v5

      # The failure that started this. A token that cannot create a release
      # cannot be discovered any other way — the job's own "Set up job" log
      # prints `Contents: write` even when the grant is capped, because that
      # line reports what the workflow REQUESTED.
      - name: the token can actually publish a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A draft against a tag that does not exist creates no tag and is
          # invisible publicly, so this is a canary with no side effects.
          if id=$(gh api -X POST "repos/$REPO/releases" \
                    -f tag_name=zz-preflight-canary -F draft=true --jq .id 2>/dev/null); then
            gh api -X DELETE "repos/$REPO/releases/$id"
            echo "GITHUB_TOKEN can create releases."
          else
            echo "::error::GITHUB_TOKEN cannot create a release, so this build would be thrown away at the end." >&2
            echo "::error::Set Settings -> Actions -> General -> Workflow permissions to 'Read and write', then DELETE AND RE-PUSH the tag." >&2
            echo "::error::A 'gh run rerun' will NOT pick the change up: a re-run reuses the grants minted when the run was created." >&2
            exit 1
          fi

      # Cutting vX.Y.Z from a tree that still says X.Y.(Z-1) produces an
      # installer whose filename, About pane and updater feed all disagree with
      # the tag. Concurrent sessions share this version namespace, so a bump
      # can also be silently taken by someone else between writing and tagging.
      - name: the tag matches the version in the tree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          check() { # <label> <actual>
            if [ "$2" != "$tag" ]; then
              echo "::error::$1 says '$2' but the tag says '$tag'" >&2
              fail=1
            else
              echo "  ok  $1 = $2"
            fi
          }
          check "package.json"            "$(node -p 'require("./package.json").version')"
          check "package-lock.json"       "$(node -p 'require("./package-lock.json").version')"
          check "package-lock (packages)" "$(node -p 'require("./package-lock.json").packages[""].version')"
          check "tauri.conf.json"         "$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          check "Cargo.toml"              "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          check "Cargo.lock"              "$(awk '/^name = "snail-mail"$/{getline; sub(/^version = "/,""); sub(/"$/,""); print; exit}' src-tauri/Cargo.lock)"
          [ "$fail" -eq 0 ] || exit 1

      # Re-tagging over a release that already has assets would upload a second
      # set beside the first rather than replacing them.
      - name: this tag has not already been released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length' 2>/dev/null | grep -qv '^0$'; then
            echo "::error::A release for $GITHUB_REF_NAME already exists WITH assets. Delete it first, or bump the version." >&2
            exit 1
          fi
          echo "no published release for $GITHUB_REF_NAME yet."

      - name: is macOS signing configured?
        id: check
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # An app-specific password, not the Apple ID password.
        run: |
          set -u
          present=0
          missing=""
          for pair in "APPLE_SIGNING_IDENTITY:$IDENTITY" "APPLE_CERTIFICATE:$CERT" \
                      "APPLE_CERTIFICATE_PASSWORD:$CERT_PASSWORD" "APPLE_ID:$APPLE_ID" \
                      "APPLE_PASSWORD:$APPLE_PASSWORD" "APPLE_TEAM_ID:$TEAM_ID"; do
            if [ -n "${pair#*:}" ]; then
              present=$((present + 1))
            else
              missing="$missing ${pair%%:*}"
            fi
          done
          if [ "$present" -eq 6 ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing configured — building the signed, notarized app."
          elif [ "$present" -eq 0 ]; then
            echo "macos=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing not set up yet — skipping that build (Windows is unaffected)."
            echo "See docs/DISTRIBUTION.md §'Signing the macOS build' for the six secrets."
          else
            # A PARTIAL set is the one state worth failing on: it means someone
            # started the setup and stopped, and a silent skip reads exactly
            # like "not started yet" — for as many releases as it takes anyone
            # to notice macOS never shipped.
            echo "::error::macOS signing is half-configured ($present/6 secrets). Missing:$missing. Set all six, or none." >&2
            exit 1
          fi

  release-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # A baked client is optional, but a HALF-baked one is not: an id without
      # its secret (or either one blank) produces an installer that reports a
      # configured client and then fails at Google. `present()` now collapses
      # blanks to None at runtime, so this only has to catch the case where
      # exactly one of the pair was set — the one silence the code cannot
      # distinguish from "no baked client at all".
      - name: baked OAuth client is whole, or absent
        shell: bash
        env:
          ID: ${{ secrets.SNAIL_GMAIL_CLIENT_ID }}
          SECRET: ${{ secrets.SNAIL_GMAIL_CLIENT_SECRET }}
        run: |
          if [ -n "$ID" ] && [ -z "$SECRET" ]; then
            echo "SNAIL_GMAIL_CLIENT_ID is set but SNAIL_GMAIL_CLIENT_SECRET is empty." >&2
            echo "This build would ship a client id with no secret. Set both, or neither." >&2
            exit 1
          fi
          if [ -z "$ID" ] && [ -n "$SECRET" ]; then
            echo "SNAIL_GMAIL_CLIENT_SECRET is set but SNAIL_GMAIL_CLIENT_ID is empty." >&2
            exit 1
          fi
          if [ -n "$ID" ]; then
            echo "baked OAuth client present (id ends ...${ID: -30})"
          else
            echo "no baked OAuth client — installers will ask for one (this is allowed)"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked-in beta OAuth client so testers skip the Google-console setup
          # (optional — builds without it still accept pasted credentials).
          #
          # These read SNAIL_*-named repo secrets directly. They used to be
          # mapped from ZENBOX_*-prefixed names, justified as "so no repo
          # reconfiguration is needed" — but those secrets had never actually
          # existed, so the indirection bought nothing and hid the fact that
          # every published installer was baking an EMPTY client. A missing
          # `${{ secrets.X }}` renders as "" rather than leaving the variable
          # unset, which is what made that invisible (see DECISIONS #141).
          SNAIL_GMAIL_CLIENT_ID: ${{ secrets.SNAIL_GMAIL_CLIENT_ID }}
          SNAIL_GMAIL_CLIENT_SECRET: ${{ secrets.SNAIL_GMAIL_CLIENT_SECRET }}
          # Baked Unsplash Access Key for the daily empty-state photo
          # (optional — builds without it just skip the photo; users can
          # paste their own key in Settings).
          # Named SNAIL_* like the Gmail pair above. It previously read a
          # FISSION_*-prefixed secret that had never been created, so every
          # build baked an empty key — which pre-v0.24.1 was sent to Unsplash
          # as if it were real (401, no photo, no error anywhere). `present()`
          # now reads empty as absent, so an unset key simply means no daily
          # photo. Optional by design: unset is a supported state, and users
          # can paste their own in Settings -> Privacy & keys.
          SNAIL_UNSPLASH_ACCESS_KEY: ${{ secrets.SNAIL_UNSPLASH_ACCESS_KEY }}
        with:
          # BUILD ONLY — no tagName/releaseId, so the action never touches the
          # Releases API. Its own create call returns 403 "Resource not
          # accessible by integration" on this repo, while the identical
          # POST /releases succeeds from the same runner with the same
          # GITHUB_TOKEN via gh and via octokit (proven with a probe workflow
          # across four variables: repo permission default, fresh vs re-run,
          # dispatch vs tag push, ubuntu vs windows). Publishing below uses the
          # call that demonstrably works, and as a bonus this workflow now owns
          # latest.json outright, which is what the macOS job has to patch.
          includeUpdaterJson: false

      # Deterministic asset names. GitHub rewrites spaces to dots on upload, so
      # renaming here makes the download URL predictable rather than inferred —
      # latest.json below has to embed that exact URL.
      - name: stage the installer under its published name
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # A glob into an array, not `ls | head -1`: the bundler's own output
          # is literally "Snail Mail_<v>_x64-setup.exe" — a filename with a
          # space in it — which is the exact case word-splitting `ls` mangles.
          shopt -s nullglob
          matches=(src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
          if [ ${#matches[@]} -ne 1 ]; then
            echo "::error::expected exactly one NSIS installer, found ${#matches[@]}" >&2
            printf '  %s\n' "${matches[@]}" >&2
            exit 1
          fi
          exe="${matches[0]}"
          name="Snail.Mail_${version}_x64-setup.exe"
          cp "$exe" "$name"
          cp "$exe.sig" "$name.sig"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$name" "$name.sig"

      # The updater feed, written by hand to the same shape tauri-action
      # produced for v0.27.0 — including the `windows-x86_64-nsis` alias beside
      # `windows-x86_64`, because clients pinned to either key must keep
      # resolving. Getting this wrong silently strands every existing install,
      # so it is verified after upload rather than assumed.
      - name: build latest.json
        shell: bash
        env:
          NAME: ${{ steps.stage.outputs.name }}
          VERSION: ${{ steps.stage.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # node, not jq: node is guaranteed here (setup-node ran), whereas jq
          # is a runner-image convenience. Discovering it missing would cost
          # another full build to find out.
          #
          # The single quotes are deliberate: `${REPO}` and `${TAG}` below are
          # JavaScript template-literal interpolations reading process.env, and
          # the shell must not touch them.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const { NAME, VERSION, REPO, GITHUB_REF_NAME: TAG } = process.env;
            const platform = {
              signature: fs.readFileSync(NAME + ".sig", "utf8").trim(),
              url: `https://github.com/${REPO}/releases/download/${TAG}/${NAME}`,
            };
            fs.writeFileSync("latest.json", JSON.stringify({
              version: VERSION,
              notes: [
                `Snail Mail ${TAG} — download the Windows installer below (\`${NAME}\`).`,
                "Existing installs download this in the background and offer to install it;",
                "if you never click, it installs when you next quit the app.",
              ].join("\n"),
              pub_date: new Date().toISOString(),
              // Both keys, same artifact: clients pinned to either must resolve.
              platforms: { "windows-x86_64": platform, "windows-x86_64-nsis": platform },
            }, null, 2));
          '
          node -e 'const f=require("./latest.json");
                   const k=Object.keys(f.platforms);
                   if(!f.version||!k.length) { console.error("empty feed"); process.exit(1); }
                   console.log("feed:", f.version, k.join(", "));'

      - name: publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.stage.outputs.name }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Snail Mail $GITHUB_REF_NAME" \
            --notes "$(node -p 'require("./latest.json").notes')" \
            --verify-tag \
            "$NAME" "$NAME.sig" latest.json

      # An updater feed that 404s or lists the wrong version is invisible until
      # nobody's app updates, so assert it end to end from the public URL.
      - name: the published feed is the one clients will read
        shell: bash
        env:
          VERSION: ${{ steps.stage.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sSL --retry 5 --retry-delay 3 -o feed.json \
            "https://github.com/$REPO/releases/latest/download/latest.json"
          got=$(node -p 'require("./feed.json").version')
          [ "$got" = "$VERSION" ] \
            || { echo "::error::latest.json says $got, expected $VERSION" >&2; exit 1; }
          url=$(node -p 'require("./feed.json").platforms["windows-x86_64"].url')
          code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url")
          [ "$code" = "200" ] || { echo "::error::installer URL in the feed returned $code: $url" >&2; exit 1; }
          echo "feed ok: version $VERSION, installer reachable"

  # Universal (Intel + Apple silicon) .app and .dmg, Developer ID signed and
  # notarized. Runs after Windows because it PATCHES that job's latest.json
  # rather than writing its own — see the merge step.
  release-macos:
    needs: [preflight, release-windows]
    if: needs.preflight.outputs.macos == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal-apple-darwin
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- Developer ID signing. Tauri imports the .p12 into a throwaway
          # keychain and signs the .app with the identity named below. ---
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # --- Notarization. Present = Tauri submits the bundle to Apple and
          # staples the ticket; absent = signed but NOT notarized, which
          # Gatekeeper still refuses on a machine that downloaded it. ---
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SNAIL_GMAIL_CLIENT_ID: ${{ secrets.SNAIL_GMAIL_CLIENT_ID }}
          SNAIL_GMAIL_CLIENT_SECRET: ${{ secrets.SNAIL_GMAIL_CLIENT_SECRET }}
          SNAIL_UNSPLASH_ACCESS_KEY: ${{ secrets.SNAIL_UNSPLASH_ACCESS_KEY }}
        with:
          # Build only, same as the Windows job — the action's Releases calls
          # are the part that 403s here. Publishing is `gh` below.
          includeUpdaterJson: false
          args: --target universal-apple-darwin

      - name: stage the macOS artifacts under their published names
        id: stage
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          # Globs into arrays — the bundle names contain a space ("Snail Mail…").
          shopt -s nullglob
          dmgs=("$bundle"/dmg/*.dmg)
          tgzs=("$bundle"/macos/*.app.tar.gz)
          if [ ${#dmgs[@]} -ne 1 ] || [ ${#tgzs[@]} -ne 1 ]; then
            echo "::error::expected one .dmg and one .app.tar.gz, found ${#dmgs[@]} and ${#tgzs[@]}" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          tgz="${tgzs[0]}"
          dmg_name="Snail.Mail_${version}_universal.dmg"
          tgz_name="Snail.Mail_${version}_universal.app.tar.gz"
          cp "$dmg" "$dmg_name"
          cp "$tgz" "$tgz_name"
          cp "$tgz.sig" "$tgz_name.sig"
          echo "dmg=$dmg_name" >> "$GITHUB_OUTPUT"
          echo "tgz=$tgz_name" >> "$GITHUB_OUTPUT"

      - name: add macOS to the release and the updater feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DMG: ${{ steps.stage.outputs.dmg }}
          TGZ: ${{ steps.stage.outputs.tgz }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$DMG" "$TGZ" "$TGZ.sig" --clobber
          # PATCH the Windows job's feed rather than writing one: two jobs each
          # emitting latest.json means the second replaces the first's platform
          # map and silently cuts the other OS off from updates.
          gh release download "$TAG" --pattern latest.json --clobber
          sig=$(cat "$TGZ.sig")
          url="https://github.com/$REPO/releases/download/$TAG/$TGZ"
          # One universal binary serves both architectures, so both keys point
          # at the same artifact. The updater looks up exactly these names.
          jq --arg url "$url" --arg sig "$sig" \
             '.platforms["darwin-x86_64"] = {signature: $sig, url: $url}
            | .platforms["darwin-aarch64"] = {signature: $sig, url: $url}' \
             latest.json > latest.merged.json
          mv latest.merged.json latest.json
          echo "updater feed now covers: $(jq -r '.platforms | keys | join(", ")' latest.json)"
          gh release upload "$TAG" latest.json --clobber

      - name: verify the signature and the notarization ticket
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::expected exactly one .app bundle, found ${#apps[@]}" >&2
            exit 1
          fi
          app="${apps[0]}"
          # Deep-verify the signature over every nested binary.
          codesign --verify --deep --strict --verbose=2 "$app"
          # The one that matters: Gatekeeper's own verdict on a downloaded app.
          # `codesign` passing while this fails is exactly the state that ships
          # an app nobody can open.
          spctl --assess --type execute --verbose=4 "$app"
          # Only present if the notarization ticket was stapled.
          xcrun stapler validate "$app"

      # Written whole rather than read-and-appended: if tauri-action's second
      # pass over an existing release ever blanks the body, appending would
      # quietly lose the Windows half instead of restoring it.
      - name: rewrite the release body to cover both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > body.md <<BODY
          Snail Mail $TAG

          **Windows** — \`Snail.Mail_*_x64-setup.exe\`
          **macOS** — the \`.dmg\` below (universal: Intel and Apple silicon,
          signed and notarized, so it opens with no Gatekeeper prompt).

          Existing installs download this in the background and offer to
          install it; if you never click, it installs when you next quit.
          BODY
          gh release edit "$TAG" --notes-file body.md
