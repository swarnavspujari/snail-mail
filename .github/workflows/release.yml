# Builds the Windows installer on every version tag and publishes it (plus the
# updater artifacts + latest.json feed) to a GitHub Release. The in-app updater
# points at .../releases/latest/download/latest.json.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           minisign key for updater artifacts
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if none)
#
# Authenticode (SmartScreen) signing is a documented opt-in — when the Azure
# Trusted Signing account exists, follow docs/DISTRIBUTION.md §"Wiring the
# signature into CI" (adds AZURE_* secrets + a signCommand in tauri.conf.json).
# Until then installers are unsigned and testers see the SmartScreen prompt.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # A baked client is optional, but a HALF-baked one is not: an id without
      # its secret (or either one blank) produces an installer that reports a
      # configured client and then fails at Google. `present()` now collapses
      # blanks to None at runtime, so this only has to catch the case where
      # exactly one of the pair was set — the one silence the code cannot
      # distinguish from "no baked client at all".
      - name: baked OAuth client is whole, or absent
        shell: bash
        env:
          ID: ${{ secrets.SNAIL_GMAIL_CLIENT_ID }}
          SECRET: ${{ secrets.SNAIL_GMAIL_CLIENT_SECRET }}
        run: |
          if [ -n "$ID" ] && [ -z "$SECRET" ]; then
            echo "SNAIL_GMAIL_CLIENT_ID is set but SNAIL_GMAIL_CLIENT_SECRET is empty." >&2
            echo "This build would ship a client id with no secret. Set both, or neither." >&2
            exit 1
          fi
          if [ -z "$ID" ] && [ -n "$SECRET" ]; then
            echo "SNAIL_GMAIL_CLIENT_SECRET is set but SNAIL_GMAIL_CLIENT_ID is empty." >&2
            exit 1
          fi
          if [ -n "$ID" ]; then
            echo "baked OAuth client present (id ends ...${ID: -30})"
          else
            echo "no baked OAuth client — installers will ask for one (this is allowed)"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked-in beta OAuth client so testers skip the Google-console setup
          # (optional — builds without it still accept pasted credentials).
          #
          # These read SNAIL_*-named repo secrets directly. They used to be
          # mapped from ZENBOX_*-prefixed names, justified as "so no repo
          # reconfiguration is needed" — but those secrets had never actually
          # existed, so the indirection bought nothing and hid the fact that
          # every published installer was baking an EMPTY client. A missing
          # `${{ secrets.X }}` renders as "" rather than leaving the variable
          # unset, which is what made that invisible (see DECISIONS #141).
          SNAIL_GMAIL_CLIENT_ID: ${{ secrets.SNAIL_GMAIL_CLIENT_ID }}
          SNAIL_GMAIL_CLIENT_SECRET: ${{ secrets.SNAIL_GMAIL_CLIENT_SECRET }}
          # Baked Unsplash Access Key for the daily empty-state photo
          # (optional — builds without it just skip the photo; users can
          # paste their own key in Settings).
          # Named SNAIL_* like the Gmail pair above. It previously read a
          # FISSION_*-prefixed secret that had never been created, so every
          # build baked an empty key — which pre-v0.24.1 was sent to Unsplash
          # as if it were real (401, no photo, no error anywhere). `present()`
          # now reads empty as absent, so an unset key simply means no daily
          # photo. Optional by design: unset is a supported state, and users
          # can paste their own in Settings -> Privacy & keys.
          SNAIL_UNSPLASH_ACCESS_KEY: ${{ secrets.SNAIL_UNSPLASH_ACCESS_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Snail Mail ${{ github.ref_name }}"
          releaseBody: |
            Snail Mail ${{ github.ref_name }} — download the Windows installer
            below (`Snail.Mail_*_x64-setup.exe`). Existing installs update
            themselves automatically.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
