name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: desktop bundle must exclude the demo mock
        shell: bash
        run: |
          npm run build:desktop
          if grep -rl "foundryaccel" dist/assets; then
            echo "demo fixture strings leaked into the desktop bundle" >&2
            exit 1
          fi
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

  # keeps the Fedora/Linux port honest — and runs the Rust test suite (with
  # the demo fixtures compiled) on the fastest runner, since no other job does
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: webkit + keychain build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --features demo-fixtures

  # Same job for macOS: WebKit and Security.framework ship with the OS, so
  # unlike Linux there are no deps to install. This is the only CI leg that
  # compiles the macOS cfg arms (badge.rs's set_badge_count path, purge.rs's
  # macOS app roots) — check-only to keep the expensive runner cheap.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
