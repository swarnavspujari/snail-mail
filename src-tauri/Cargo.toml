[package]
name = "snail-mail"
version = "0.26.0"
description = "Snail Mail — keyboard-first, AI-native email client"
authors = ["Swarnav S Pujari"]
license = "MIT"
edition = "2021"
default-run = "snail-mail"

[lib]
name = "snail_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "snail-mail"
path = "src/main.rs"

# dev-secrets is a keychain-WRITING developer utility. Cargo auto-discovers
# anything in src/bin/, and tauri-cli bundles every discovered bin as an
# "external binary" — which is how dev-secrets.exe ended up shipping inside the
# installed app directory next to the real app (verified in the generated
# installer.nsi: `File /a "/oname=dev-secrets.exe" …`).
#
# Declaring it explicitly with required-features takes it out of every default
# build, so `cargo build --release` (what `tauri build` runs) never produces the
# exe and the bundler has nothing to pick up. To use it locally:
#
#     SNAIL_SECRET_VALUE=... cargo run --features dev-secrets --bin dev-secrets -- set ai:nim
[[bin]]
name = "dev-secrets"
path = "src/bin/dev-secrets.rs"
required-features = ["dev-secrets"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# statically-linked SQLite extension: vec0 virtual tables for semantic search
sqlite-vec = "0.1.9"
# local sentence embeddings (ONNX, quantized bge-small); rustls to match reqwest
fastembed = { version = "5.17", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
# one crate, three OS keychains: Credential Manager / Keychain / Secret Service
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
url = "2"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ammonia = "4"
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
harper-core = { version = "2.5.0", features = ["concurrent"] }

# Demo fixtures: the fake account pair, seeded mail, synthesized calendar
# events and the toy concept embedder. Default OFF — shipped builds must
# contain none of it, and with the feature off the fixture module is not even
# compiled. Enable only to exercise the fixture tests:
#     cargo test --features demo-fixtures
[features]
demo-fixtures = []

# Opt-in gate for the dev-secrets bin target above. Default OFF so the utility
# is never built, and therefore never bundled, by a release build.
dev-secrets = []

[profile.release]
strip = true
lto = true
codegen-units = 1
